# csv-query-tool composition: the tool registry, the system-prompt assembler
# it wires schemas into, and the demo plugin. The test suite mounts the same
# three services in-process and passes plugin config directly (see the spec);
# this file shows the Loader path, where config comes from the `config:` field.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: csv-query-tool
  name: './src/index.ts'
  # Plugin config (Schemastery schema defaults apply for omitted fields):
  # config:
  #   defaultDelimiter: ';'
  #   maxRows: 500
