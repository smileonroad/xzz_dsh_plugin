# 把离线模型适配器挂进某个 profile 的 overlay。
#
#   pnpm dsh web --patch examples/scripted-llm-adapter/cordis.patch.yml
#   node demo/run-headless.mjs --patch examples/scripted-llm-adapter/cordis.patch.yml "你好"
#
# 入口名相对**本 patch 文件所在的目录**解析，所以这里写 `./src/index.ts`。
# （只有放在 profile 目录里的 `cordis.patch.yml` 才是相对 profile 目录解析，
# 那种写法需要 profile 下的 examples junction；本文件在自己目录里，不需要。）
# 要写绝对路径时 Windows 必须带 `file:///` 前缀，例如
# `file:///C:/path/to/deepseek-harness/examples/scripted-llm-adapter/src/index.ts`，
# 裸 `C:/...` 会被当成 URL scheme 报 ERR_UNSUPPORTED_ESM_URL_SCHEME。
#
# 第二行把默认模型指到离线提供方，但**它可能不生效**：`agent-default-model`
# 的值会被 settings 用户层（`$DSH_HOME/settings.yaml`）覆盖，而真实 home 里通常
# 已经存了用户的模型选择。要一个稳定的离线演示，用本示例自带的
# `scripts/demo.mjs`（它造一个一次性 DSH_HOME，settings 与 overlay 都在里面）。
- insert:
    - id: scripted-llm
      name: './src/index.ts'
    # 拦截图层：命中词表就不调模型，直接返回自定义文本。词表与文案走插件的
    # Schemastery Config，所以改词不用改代码。
    - id: prompt-guard
      name: './src/guard.ts'
      config:
        words: ['权限', '密码', '密钥']
        refusal: '非法内容，请重新输入。'

- id: agent-default-model
  config:
    provider: scripted
    model: demo
