# Web overlay: load the laundromat's Host half into a dsh profile.
# Applied from the deepseek-harness root:
#   pnpm dsh web --patch examples/laundry-demo/laundry.patch.yml
#
# Only the Host half (the tool that records the laundry/* session events)
# mounts here — it needs no build. The Client half (src/client/, the chat
# card) is browser code; a real page serves it through the client module
# system only when the package is built as a clientBundle with a `dsh.client`
# declaration and a `./client` export (distribution path, see the README).
# In-process, the Client half is verified by driving the real
# ConversationNodeAssembler with fixture events (laundry-definition spec) and
# pinning the renderer's React-free pure projection (laundry-view spec).
#
# Entry `name` resolution (measured 2026-09-17): a leading `.` resolves against
# THE DIRECTORY OF THIS PATCH FILE, not the profile directory and not the cwd.
# This file sits next to `src/`, so `./src/machine.ts` needs no junction; the
# profile-level `cordis.patch.yml` is the one that resolves against the profile
# directory. An absolute URL needs the Windows `file:///` prefix (a bare
# `D:/...` is read as the URL scheme `d:` and rejected by the ESM loader).
- insert:
    - id: laundry-machine
      name: './src/machine.ts'
