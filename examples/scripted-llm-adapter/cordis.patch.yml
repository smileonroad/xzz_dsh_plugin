# 把剧本适配器挂进某个 profile 的 overlay。
#
#   pnpm dsh web --patch examples/scripted-llm-adapter/cordis.patch.yml
#   node demo/run-headless.mjs --patch examples/scripted-llm-adapter/cordis.patch.yml "你好"
#
# 入口名相对 **profile 目录**（`~/.dsh/profiles/<name>/`）解析，不是相对本文件，
# 所以 profile 目录下要有一个指向 harness `examples/` 的 examples junction
# （web profile 的常规做法）；没有 junction 时把 name 换成 file:/// 绝对 URL，
# 例如 `file:///D:/myPI/deepseek-harness/examples/scripted-llm-adapter/src/index.ts`。
#
# 第二行把默认模型指到剧本提供方，但**它可能不生效**：`agent-default-model`
# 的值会被 settings 用户层（`$DSH_HOME/settings.yaml`）覆盖，而真实 home 里通常
# 已经存了用户的模型选择。要一个稳定的离线演示，用本示例自带的
# `scripts/demo.mjs`（它造一个一次性 DSH_HOME，settings 与 overlay 都在里面）。
- insert:
    - id: scripted-llm
      name: './examples/scripted-llm-adapter/src/index.ts'

- id: agent-default-model
  config:
    provider: scripted
    model: demo
