# Bundle layer: plugin rows reference the package by name, so Node resolution
# finds the installed code in the profile's node_modules. Installed with:
#   pnpm dsh plugin --profile web add examples/csv-query-tool/bundle
# Plugin config is supplied here — omitted fields take Schema defaults. The
# maxRows: 2 below is the E2E verification fixture: a 3-row CSV can only
# return 2 rows with truncated: true, proving the config reaches the tool.
- insert:
    - id: csv-query-tool
      name: dsh-csv-query-tool
      config:
        maxRows: 2
