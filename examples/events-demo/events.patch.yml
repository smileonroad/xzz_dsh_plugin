# Web overlay: load the events demo into the web profile
# (dsh-base + dsh-web-app bundle layers). Applied from the deepseek-harness root:
#   pnpm dsh web --patch examples/events-demo/events.patch.yml
#
# Events plugins have no visible UI: mounted in web they show nothing by
# themselves. The meaningful verification for this example is the test suite,
# which drives the real harness `tools/pre-execute` waterfall and the real
# `commands/change` emit event. Mount them anyway when you want the demo
# policy active on a running web instance, or keep this patch as the standing
# local demo composition.
#
# HOW the entry `name` resolves (measured 2026-09-17 against the current loader):
#   - `cordis:` prefix   -> builtin
#   - starts with `.`    -> resolved against THE DIRECTORY OF THIS PATCH FILE,
#                          not the profile directory and not the current
#                          working directory. A profile-level
#                          `cordis.patch.yml` therefore resolves against the
#                          profile directory, while this file resolves against
#                          the example directory it lives in.
#   - anything else      -> passed to import() as-is: an absolute file:// URL
#                          or a bare package name.
# Because this file sits next to `src/`, the entries below need no junction and
# no absolute path. Alternatives:
#
# 1. ABSOLUTE file:// URL (works everywhere, machine-specific):
#    name: 'file:///D:/path/to/deepseek-harness/examples/events-demo/src/tool-observer.ts'
#    The `file:///` prefix is mandatory on Windows (a bare `D:/...` is read as
#    the URL scheme `d:` and rejected by the ESM loader).
# 2. A patch that lives in the profile directory can skip the checkout path by
#    putting an `examples` junction there:
#      cmd //c "mklink /J %USERPROFILE%\.dsh\profiles\web\examples <deepseek-harness>\examples"
#    and then writing `./examples/<name>/src/<file>.ts`.
# For portable distribution, promote the example to a bundle and
# `dsh plugin add` it instead of using --patch.
- insert:
    - id: events-demo-tool-observer
      name: './src/tool-observer.ts'
    - id: events-demo-tool-policy
      name: './src/tool-policy.ts'
